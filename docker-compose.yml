services:
  app:
    build: .
    container_name: cetpa-app
    ports:
      # Sadece localhost'a bağla — Nginx reverse proxy üzerinden dışarı açılır
      - "127.0.0.1:5173:5173"
    env_file:
      - .env.production
    extra_hosts:
      # Host üzerindeki PostgreSQL'e erişim: DATABASE_URL host.docker.internal kullanır
      - "host.docker.internal:host-gateway"
    volumes:
      # Mount service account so it survives container rebuilds
      - /opt/cetpa/firebase-service-account.json:/app/service-account.json:ro
      # Firestore yedekleri host'ta kalıcı olsun
      - /opt/cetpa/backups:/app/backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
