name: CI & Deploy

on:
  push:
    # main -> PRODUCTION. staging/** -> STAGING (ayri servis, ayri veritabani,
    # public DNS yok). 2026-08-24'e kadar staging kurulum scripti vardi ama
    # CI'a hic baglanmamisti: her degisiklik dogrudan canliya gidiyordu.
    branches: [main, 'staging/**']
  pull_request:
    branches: [main]

# Ayni anda TEK deploy kossun. 2026-07-30'da iki push 70 saniye arayla gitti;
# ikinci kosu, birincisi saglik yoklamasi yaparken servisi yeniden baslatti ve
# birinciyi haksiz yere dusurdu (health check 10/10 basarisiz, oysa uygulama
# saglikliydi).
#
# cancel-in-progress KESINLIKLE false: kosan bir deploy'u yarida kesmek sunucuyu
# yarim dosya durumunda birakabilir (git reset + npm ci + build ortasinda).
# Yeni push kuyrukta bekler, siras gelince tam olarak kosar.
#
# Grup ref bazli: main'e giden tum push'lar TEK kuyrukta bekler, ama acik bir
# PR'in kontrolleri main deploy'unun arkasina takilmaz (sabit grup adi
# kullanilsaydi takilirdi).
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

# GITHUB_TOKEN'a en az yetki (CodeQL "Workflow does not contain permissions").
# Varsayilan token genis yazma kapsamiyla geliyor; bu workflow depoya HIC
# yazmiyor: build sadece checkout+tsc+test+build, deploy ise yalnizca SSH ile
# VDS'e baglaniyor. Ust duzeyde tanimli - eklenecek yeni is'ler de devralir.
permissions:
  contents: read

jobs:
  build:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: npx vitest run
      - name: Build
        run: npm run build

  deploy:
    name: Deploy to Windows VDS
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy secrets
        id: check
        run: |
          if [ -n "${{ secrets.VDS_SSH_KEY }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VDS_SSH_KEY tanımlı değil — deploy atlandı."
          fi

      - name: Setup SSH
        if: steps.check.outputs.enabled == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VDS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VDS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy (SSH → PowerShell)
        if: steps.check.outputs.enabled == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.VDS_USER }}@${{ secrets.VDS_HOST }}" \
            "powershell -ExecutionPolicy Bypass -File C:\\cetpa\\deploy\\windows\\deploy.ps1"

      - name: Health check (public HTTPS)
        if: steps.check.outputs.enabled == 'true'
        run: |
          sleep 10
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://app.cetpa.com.tr/api/health)
          echo "Health: HTTP $code"
          [ "$code" = "200" ] || exit 1

  # ── STAGING ────────────────────────────────────────────────────────────────
  # `staging/**` dalina push -> ayni deploy.ps1, farkli parametrelerle:
  # ayri dizin, ayri port, ayri NSSM servisi, IIS'e DOKUNMAZ (-SkipIis).
  # Saglik yoklamasi SSH tuneli uzerinden LOCALHOST'a yapilir; staging'in
  # public adresi bilerek yok (bkz. deploy/windows/setup-staging.ps1).
  #
  # ONKOSUL: sunucuda bir kez `setup-staging.ps1` calistirilmis olmali.
  # Calistirilmadiysa is temiz bir mesajla atlanir, CI'i kirmaz.
  deploy-staging:
    name: Deploy to STAGING
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/staging/')
    runs-on: ubuntu-latest
    steps:
      - name: SSH anahtari var mi
        id: check
        run: |
          if [ -n "${{ secrets.VDS_SSH_KEY }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VDS_SSH_KEY tanimli degil - staging deploy atlandi."
          fi

      - name: Setup SSH
        if: steps.check.outputs.enabled == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VDS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VDS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Staging kurulu mu
        id: kurulu
        if: steps.check.outputs.enabled == 'true'
        run: |
          var=$(ssh -i ~/.ssh/deploy_key "${{ secrets.VDS_USER }}@${{ secrets.VDS_HOST }}" \
            "powershell -Command \"if (Test-Path C:\\cetpa-staging\\server.ts) { 'VAR' } else { 'YOK' }\"" || echo YOK)
          echo "$var" | grep -q VAR && echo "hazir=true" >> "$GITHUB_OUTPUT" || {
            echo "hazir=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Staging kurulu degil. Sunucuda bir kez calistir: powershell -ExecutionPolicy Bypass -File C:\\cetpa\\deploy\\windows\\setup-staging.ps1"
          }

      - name: Deploy (SSH -> PowerShell)
        if: steps.kurulu.outputs.hazir == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.VDS_USER }}@${{ secrets.VDS_HOST }}" \
            "powershell -ExecutionPolicy Bypass -File C:\\cetpa\\deploy\\windows\\deploy.ps1 -AppDir C:\\cetpa-staging -AppPort 5174 -ServiceName cetpa-staging -Branch ${{ github.ref_name }} -SkipIis"

      - name: Health check (sunucu icinden localhost)
        if: steps.kurulu.outputs.hazir == 'true'
        run: |
          sleep 10
          kod=$(ssh -i ~/.ssh/deploy_key "${{ secrets.VDS_USER }}@${{ secrets.VDS_HOST }}" \
            "powershell -Command \"try { (Invoke-WebRequest -UseBasicParsing -TimeoutSec 30 http://localhost:5174/api/health).StatusCode } catch { 0 }\"" | tr -d '\r')
          echo "Staging health: HTTP $kod"
          [ "$kod" = "200" ] || exit 1
