# /etc/nginx/conf.d/cetpa.conf
# VDS'de: sudo cp nginx.conf /etc/nginx/conf.d/cetpa.conf
#         sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name app.cetpa.com.tr;

    # Certbot bu bloğu otomatik HTTPS'e yönlendirecek
    # Hashed static assets — 1 year cache (content hash changes on rebuild)
    location ~* ^/assets/.+\.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        proxy_pass         http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        add_header         Cache-Control "public, max-age=31536000, immutable";
        add_header         Vary "Accept-Encoding";
    }

    location / {
        proxy_pass         http://127.0.0.1:5173;
        proxy_http_version 1.1;

        # WebSocket support (Firebase realtime + HMR)
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection 'upgrade';

        # Client IP forwarding
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;

        # index.html — no cache (always fresh so new deploys are picked up)
        add_header         Cache-Control "no-cache, no-store, must-revalidate";

        # Timeouts
        proxy_read_timeout  60s;
        proxy_send_timeout  60s;
        proxy_connect_timeout 10s;
    }

    # Gzip compression (proxied responses included)
    gzip              on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_vary         on;
    gzip_types        text/plain text/css application/json application/javascript
                      text/javascript text/xml application/xml image/svg+xml
                      application/wasm font/woff2;
    gzip_min_length   1000;
}
